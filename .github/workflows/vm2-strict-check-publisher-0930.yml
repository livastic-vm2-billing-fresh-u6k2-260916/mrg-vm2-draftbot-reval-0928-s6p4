name: VM2 Strict Check Publisher 0930
on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact controlled commit SHA to attest
        required: true
        type: string
permissions:
  contents: read
  checks: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Publish trusted check on controlled SHA
        uses: actions/github-script@v8
        with:
          script: |
            const sha = core.getInput('target_sha') || context.payload.inputs?.target_sha;
            await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'vm2-strict-gate-0930',
              head_sha: sha,
              status: 'completed',
              conclusion: 'success',
              output: { title: 'VM2 trusted strict gate', summary: 'Controlled success for strict-injection discriminator' }
            });
